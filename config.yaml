# Solana smart-wallet copy-trader v1 — PAPER mode. Every rule below is tunable.
mode: paper                 # paper only. "live" is a disabled stub and the app refuses to start with it.
timezone: Africa/Lagos      # day boundaries (daily cap, daily PnL) + scheduled jobs
daily_summary_hour: 21      # local hour for the Telegram daily PnL summary

budget:                     # Helius free = 1M credits/month. Our own meter; the Helius dashboard is the truth.
  helius_monthly_credits: 900000   # 10% headroom under 1M
  hard_stop_frac: 0.97             # above this share of the monthly budget: scouting stops, webhook is removed
  scout_share: 0.35                # max share of the daily allowance scout + backfill may spend
  score_share: 0.10                # max share for the daily rescore of watchlist wallets
  winners_share: 0.10              # max share for the daily winners backfill scout
  deep_share: 0.50                 # max share of that day's allowance for the weekly deep scout (also capped per run below)

rate_limits:
  helius_rps: 8             # free plan 10 RPS
  jupiter_rps: 0.45         # keyless 0.5 RPS (30/min sliding window)
  dexscreener_rps: 0.9      # boosts/profiles endpoints are 60/min

endpoints:
  helius_rpc: https://mainnet.helius-rpc.com/
  helius_webhooks: https://api-mainnet.helius-rpc.com/v0/webhooks
  jupiter_quote: https://api.jup.ag/swap/v1/quote
  dexscreener: https://api.dexscreener.com

scout:                      # candidates = early buyers of recently pumped tokens
  interval_min: 120
  tokens_per_run: 5
  min_pair_age_h: 0.5       # loosened 2026-10-26 (was 1 / 72 h / 300% / $20k): too few picks
  max_pair_age_h: 120
  min_change_pct: 150       # max(h6, h24) price change %
  min_liquidity_usd: 10000
  early_tx_limit: 200       # oldest txs of the mint to read (20 credits)
  early_window_min: 30      # buyers within first N minutes of launch
  sniper_slots: 2           # skip buys in launch slot + next N-1 slots (block 0/1 snipers)
  max_buyers_per_token: 12
  backfill_per_run: 6       # candidate wallets backfilled + scored per run
  backfill_limit: 500       # txs per page (50 credits)
  backfill_pages: 1
  # Deep winners scout (1-year lookback): weekly + /scout_winners deep. Mints looked up on Dexscreener 2026-10-26
  # (search by name/symbol, highest 24h volume, clones with liquidity ~= mcap dropped; PNUT via address lookup because
  # name search only returned clones). launched = earliest Dexscreener pair. NOTE: all of these launched more than
  # 12 months ago, so with seed_max_age_days: 1500 they are skipped and logged; raise it (e.g. 1500) to scan them.
  seed_winners:
    - {symbol: TRUMP,    mint: 6p6xgHyF7AeE6TZkSmFsko444wqoP15icUSqi2jfGiPN, launched: 2025-01-18}
    - {symbol: FARTCOIN, mint: 9BB6NFEcjBCtnNLFko2FqVQBq8HHM13kCyYcdQbgpump, launched: 2024-10-18}
    - {symbol: PNUT,     mint: 2qEHjDLDLbuBgRYvsxhc5D6uDWAivNFZGan56P1tpump, launched: 2024-10-31}
    - {symbol: GOAT,     mint: CzLSujWBLFsSjncfkh59rUFqvafWcY5tzedWJSuypump, launched: 2024-10-10}
    - {symbol: MOODENG,  mint: ED5nyyWEzpPPiWimP8vYm7sD7TD3LAt3Q3gRTWHzPJBY, launched: 2024-09-10}
    - {symbol: CHILLGUY, mint: Df6yfrKC8kZE3KNkrHERKzAetSxbrWeniQfyJY4Jpump, launched: 2024-11-15}
    - {symbol: AI16Z,    mint: HeLp6NuQkmYB4pYWo2zYs22mESHXPQYzXbB8n4V98jwC, launched: 2024-10-25}
    - {symbol: MEW,      mint: MEW1gQWJ3nEXg2qgERiKu7FAFj79PHvQVREQUzScPP5, launched: 2024-03-26}
    - {symbol: BOME,     mint: ukHH6c7mMyiWCf1b9pnWe25TSpkDDt3H5pQZgZ74J82, launched: 2024-03-14}
    - {symbol: POPCAT,   mint: 7GCihgDB8fe6KNjn2MYtkzZcRjQy3t9GHdC8uHYmW2hr, launched: 2023-12-12}
    - {symbol: WIF,      mint: EKpQGSJtjMFqKZ9KQanSqYXRcF8fBopzLHYxdM65zcjm, launched: 2023-11-20}
    - {symbol: BONK,     mint: DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263, launched: 2022-12-20}
  deep:
    enabled: true
    run_weekday: 6            # 0 = Monday ... 6 = Sunday (local time)
    run_hour: 4
    max_age_days: 365         # Dexscreener-discovered winners launched within N days
    seed_max_age_days: 1500    # same for seed_winners (raise to include older famous coins)
    tokens_per_run: 12
    min_mcap_usd: 10000000
    min_volume_usd: 50000     # 24h volume; filters dead clones
    max_liq_mcap_ratio: 0.6   # liquidity ~= mcap is the fingerprint of fake clone pairs
    search_queries: [pump, meme, solana, dog, cat, ai, official, coin]
    window_min: 60            # early window after launch
    slices_min: [0, 2, 5, 10, 20, 35, 50]   # gTFA asc slices sampled inside the window (no paging through history)
    slice_limit: 100          # txs per slice (10 credits)
    sniper_slots: 2           # block 0/1 buyers are snipers (excluded)
    bundle_min_wallets: 3     # >= N early buyers in the same slot = bundle (excluded)
    pre_move_frac: 0.25       # "before the big move" = paid <= 25% of the later high
    max_buyers_per_token: 60
    max_credits_per_token: 400
    max_credits_per_run: 12000
    archival_cost: 10         # credits per getSignaturesForAddress / getTransaction in the fallback (Helius docs say 1 or 10)
    max_sig_pages: 10         # fallback only: skip tokens needing more 1000-signature pages to reach launch
    max_fallback_txs: 30
    min_repeat: 2             # early (pre-move) on >= N separate winners -> insider_likely if active
    active_days: 7            # watchlist needs a swap/tx in the last N days; others go to the dormant list
    wallets_per_run: 10
    dormant_recheck_days: 7
    dormant_per_run: 20
    insider_score_bonus: 100  # ranks 🎯 wallets first

scoring:                    # docs/architecture.md "Wallet scoring (v1)"
  profile: relaxed          # relaxed (paper default) | strict (the thresholds below as written). Telegram: /set scoring_profile strict
  profiles:                 # relaxed only loosens performance rules; sniper / dev / bundler / funder / wash / insider filters never change
    relaxed: {min_closed_trades: 3, min_win_rate: 0.40, min_realized_pnl_sol: 0, min_median_win_mult: 1.5,
              max_top_trade_share: 0.8, max_median_entry_min: 240, min_median_hold_min: 1, max_median_hold_min: 10080,
              allow_unknown_entry: true}
  window_days: 30
  min_closed_trades: 20
  min_win_rate: 0.55
  win_min_gain: 0.30        # win = realized >= +30%
  min_realized_pnl_sol: 50
  min_median_win_mult: 2.0
  max_top_trade_share: 0.5  # profit not from one lucky trade
  min_median_entry_min: 0   # median buy delay after pool/launch, minutes
  max_median_entry_min: 30
  sniper_seconds: 3         # buys this close to launch count as sniper buys
  max_sniper_share: 0.2
  min_median_hold_min: 10
  max_median_hold_min: 1440
  max_insider_share: 0.2    # tokens received without buying (transfers in / pre-launch supply)
  max_bundle_share: 0.3     # buys sharing slot+mint with another candidate wallet
  fast_dump_seconds: 60
  max_fast_dump_share: 0.3  # buy -> pump -> dump within seconds
  max_wash_share: 0.2       # sub-minute round trips at ~1.0x
  funder_cluster_max: 3     # >= N candidate wallets with the same funder = cluster, exclude
  closed_sold_frac: 0.9     # position counts as closed when >= 90% sold
  max_watch: 25
  demote_loss_streak: 5
  demote_on_rule_fail: true
  rescore_hour: 4           # local hour for the daily re-score / decay

watch:
  mode: webhook             # webhook (needs PUBLIC_URL or RENDER_EXTERNAL_URL) | poll
  poll_daily_credits: 12000 # poll mode: interval auto-stretches to stay inside this
  min_poll_interval_s: 60
  min_wallet_buy_sol: 0.2   # ignore dust buys by the watched wallet
  max_signal_age_s: 180     # ignore buys older than this when they reach us

execution:
  per_trade_sol: 0.1
  max_per_trade_sol: 0.1    # ceiling for Telegram /set trade_sol (also capped at daily_cap_sol)
  daily_cap_sol: 1.0
  max_open: 5
  slippage_bps: 1500
  sim_slippage_bps: 100     # haircut on Jupiter outAmount for simulated fills
  sim_fee_sol: 0.0005       # per simulated tx (base + priority fee)
  max_price_impact: 0.15
  max_entry_vs_wallet: 1.5  # skip if our price > 1.5x the wallet's entry
  min_liquidity_usd: 10000
  require_authorities_revoked: true
  max_roundtrip_loss: 0.30  # honeypot check: immediate sell quote must return >= 70%
  exit_check_s: 30
  tp1_mult: 2.0
  tp1_frac: 0.5
  tp2_mult: 3.0
  # tp_ladder:              # optional; overrides tp1/tp2. frac = share of the INITIAL position; a sum < 1 leaves a runner
  #   - {mult: 2, frac: 0.5}  # (exited by follow / stop-loss / time stop). Paste the one /exits suggests here.
  #   - {mult: 5, frac: 0.5}
  stop_loss_mult: 0.5       # -50%
  time_stop_h: 24
  fallback_haircut: 0.15    # if Jupiter has no sell route, value at Dexscreener price minus this

exits:                      # exit analytics (/exits, daily line) + optional auto-tuned TP ladder
  entry_delay_slippage: 0.15  # our simulated entry = wallet's first-buy price x (1 + this)
  peak_window_h: 24         # peak after our entry is measured inside this window
  hit_levels: [2, 3, 5, 10, 20, 50, 100]
  ladder_levels: [1.5, 2, 3, 5, 10, 20, 50, 100]   # TP levels the recommender may use
  ladder_fracs: [0.25, 0.5, 0.75, 1.0]              # tranche sizes it may use
  max_tranches: 3
  min_first_hit: 0.60       # safety bias: first tranche must be reached by >= 60% of trades after our entry
  min_level_hits: 3         # every level used must have been reached by >= N trades (no fitting to 1-2 moonshots)
  min_cases: 15             # no recommendation below this many trades with price data
  auto_tune_exits: false    # true: NEW paper trades use the recommended ladder (open ones keep theirs)...
  auto_tune_min_paper_trades: 30   # ...but only after this many closed paper trades
  reco_max_age_h: 26        # cached recommendation is recomputed when older (normally refreshed by the daily summary)
  sample_retention_days: 30 # our 30 s price samples are pruned after this

clusters:                   # smart-money cluster alert: several WATCHLIST wallets buying the same new token
  enabled: true
  min_wallets: 3            # >= N distinct watch wallets inside the window ...
  window_min: 60            # ... rolling window, minutes (buys in [this buy - window, this buy])
  min_wallets_for_amount: 2 # ... OR >= N wallets whose combined buys are >= min_total_sol
  min_total_sol: 5.0
  max_token_age_h: 24       # only tokens whose pair is younger than this
  realert_wallets_delta: 2  # after the first alert, alert again only at +N wallets ...
  realert_sol_mult: 2.0     # ... or when the total SOL reaches this multiple of the last alerted total
  auto_paper_buy: false     # reserved for later: clusters are alert-only, nothing is bought

winners:                    # winners backfill scout: seed candidates from big recent pumps (daily + /scout_winners)
  enabled: true
  run_hour: 3               # local hour, once a day
  tokens_per_run: 20        # new winner tokens per run (each token is processed once)
  max_age_days: 30          # pair created within the last N days ...
  min_age_h: 24             # ... and at least this old (so early buyers had time to sell)
  min_mcap_usd: 500000      # loosened 2026-10-26 (was 1M / 50k). SOL, wSOL, LSTs and stables are always excluded
  min_liquidity_usd: 25000
  search_queries: [pump, solana, meme, bonk]   # free Dexscreener /latest/dex/search words (plus boosts/profiles/scouted mints)
  early_tx_limit: 200       # oldest txs of the mint (20 credits)
  early_window_min: 60      # early = bought within N min of the first tx ...
  max_entry_frac_of_now: 0.2  # ... or at <= 20% of the current price
  sniper_slots: 2
  max_buyers_per_token: 25
  min_repeat: 2             # early on >= N winners AND sold >= min_realized_mult on >= N of them
  min_realized_mult: 3.0
  min_sold_frac: 0.5        # at least half the bag sold for the realized multiple to count
  active_days: 7            # must have a swap in the last N days
  wallets_per_run: 8        # history fetches per run (50 credits each)
  recheck_days: 7           # don't re-fetch a wallet that failed within N days
  fallback_min_repeaters: 3 # fewer repeaters than this -> also check history of the top N early buyers ...
  fallback_top_n: 20        # ... (1 realized win needed instead of min_repeat; all scorer filters still apply; budget-capped)
